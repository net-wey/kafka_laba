services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES}

  zookeeper:
    image: ${ZOOKEEPER_IMAGE}
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}

  kafka:
    image: ${KAFKA_IMAGE}
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: ${KAFKA_HEALTHCHECK_INTERVAL}
      timeout: ${KAFKA_HEALTHCHECK_TIMEOUT}
      retries: ${KAFKA_HEALTHCHECK_RETRIES}

  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    environment:
      DATA_PORT: ${DATA_SERVICE_PORT}
      POSTGRES_DSN: ${POSTGRES_DSN}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPICS: ${KAFKA_TOPICS}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    environment:
      API_PORT: ${API_SERVICE_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC_POST_CREATED: ${KAFKA_TOPIC_POST_CREATED}
      KAFKA_TOPIC_COMMENT_CREATED: ${KAFKA_TOPIC_COMMENT_CREATED}
      KAFKA_TOPIC_LIKE_CREATED: ${KAFKA_TOPIC_LIKE_CREATED}
      KAFKA_TOPIC_VIEW_CREATED: ${KAFKA_TOPIC_VIEW_CREATED}
      DATA_SERVICE_URL: http://data-service:${DATA_SERVICE_PORT}
    depends_on:
      data-service:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "${API_SERVICE_PORT}:${API_SERVICE_PORT}"
